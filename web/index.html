<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eris · AI Substitute Teacher</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b6e66'/%3E%3Cpath d='M10 9h12v3H13.5v2.5H21v3h-7.5V20H22v3H10z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <!-- three.js for the talking avatar, vendored (MIT); only downloaded when the avatar is shown -->
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/studio.css">
  <link rel="stylesheet" href="css/classroom.css">
  <link rel="stylesheet" href="css/platform.css">
  <script>
    try { const t = localStorage.getItem("eris-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app signed-out" id="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 28 28"><rect width="28" height="28" rx="8" fill="var(--accent)"/><path d="M8.5 8.5h11M8.5 14h8M8.5 19.5h11M8.5 8.5v11" stroke="var(--bg)" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg></span>
        <span class="brand-text"><strong>Eris</strong></span>
      </a>

      <nav class="nav">
        <a class="nav-item" href="#/" data-nav="home" title="Home">
          <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
          <span>Home</span>
        </a>
      </nav>

      <div class="sidebar-section">
        <div class="sidebar-heading">
          <span>Courses</span>
          <button class="icon-btn sm" id="new-lecture-btn" title="New course" aria-label="New course">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <ul class="lecture-list" id="lecture-list"></ul>
      </div>

      <div class="sidebar-footer">
        <div class="user-chip" id="user-chip"></div>
        <button class="nav-item" id="signout-btn" title="Sign out">
          <svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>
          <span>Sign out</span>
        </button>
        <button class="nav-item" id="theme-btn" title="Toggle theme">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span>Theme</span>
        </button>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-root" id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
